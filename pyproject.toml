[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuauto"
dynamic = ["version"]
description = "Finds NUworks co-op postings that fit your resume and submits the ones you approve."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Versions installed on the laptop 2026-10-03. Firefox for Playwright: python -m playwright install firefox
dependencies = [
    "gspread==6.2.1",
    "playwright==1.63.0",
    "pypdf==6.19.0",
    "scikit-learn==1.9.1",
]

[project.scripts]
nuauto = "nuauto.cli:main"

[tool.setuptools.dynamic]
version = {attr = "nuauto.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nuauto = ["gui_static/*"]  # the GUI's page, styles and scripts (nuauto gui)
