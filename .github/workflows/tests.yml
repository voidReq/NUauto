# `nuauto test` on Linux and macOS for every pull request and every push to main (a branch is tested once, by its pull
# request; any branch can also be run by hand: Actions > tests > Run workflow). Everything is offline (demo mode for
# the GUI): no Google, no NUworks, no Claude, no secrets.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # a new push to a pull request stops that pull request's older run
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install NUauto
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
      - name: Install Playwright's Firefox
        run: .venv/bin/python -m playwright install --with-deps firefox
      - name: Tests
        run: .venv/bin/nuauto test
