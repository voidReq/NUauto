# `nuauto test` on Linux and macOS for every pull request and every push to main (a branch is tested once, by its pull
# request; any branch can also be run by hand: Actions > tests > Run workflow). Everything is offline (demo mode for
# the GUI): no Google, no NUworks, no Claude, no secrets.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # a new push to a pull request stops that pull request's older run
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install NUauto
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
      - name: Install Playwright's Firefox
        # GitHub's Linux runners ship Firefox, so they already have the system libraries it needs; they are installed
        # (apt, which can take 20+ minutes when Ubuntu's mirror is slow) only if Firefox does not start without them
        run: |
          .venv/bin/python -m playwright install firefox
          if [ "$RUNNER_OS" = Linux ] && ! .venv/bin/python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              p.firefox.launch().close()
          EOF
          then
            echo "Firefox did not start: installing the system libraries it needs"
            sudo .venv/bin/python -m playwright install-deps firefox
          fi
      - name: Tests
        run: .venv/bin/nuauto test
